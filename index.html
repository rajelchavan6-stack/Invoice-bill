<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Buddy — GST Invoices in Seconds | Free Billing for Indian Businesses</title>
<meta name="description" content="Make GST-ready invoices in seconds. Auto CGST/SGST/IGST, share on WhatsApp, save as PDF. Free, no login, works on your phone. Built for Indian shops and freelancers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#102A2E; --teal:#0F766E; --teal-dk:#0B5650; --amber:#F59E0B;
    --paper:#FBFAF7; --panel:#FFFFFF; --line:#E7E5E0; --muted:#6B7280;
    --soft:#F0F4F3; --mint:#E7F3F1;
    --shadow:0 1px 2px rgba(16,42,46,.06),0 8px 24px rgba(16,42,46,.07);
    --shadow-lg:0 30px 60px -20px rgba(16,42,46,.35);
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;overflow-x:clip}
  html{max-width:100%}
  img{max-width:100%}
  h1,h2,h3,.disp{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;line-height:1.1}
  .num{font-variant-numeric:tabular-nums}
  a{color:inherit;text-decoration:none}
  button{font-family:'Inter';font-weight:600;font-size:14px;border:none;border-radius:11px;padding:11px 18px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:8px}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-primary:hover{background:var(--teal-dk)}
  .btn-amber{background:var(--amber);color:#3a2700}
  .btn-line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn-wa{background:#25D366;color:#062b14}
  .btn-ghost{background:rgba(255,255,255,.1);color:#fff}

  /* ============ NAV ============ */
  nav{position:sticky;top:0;z-index:50;background:rgba(251,250,247,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
  .nav-in{max-width:1140px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--amber));display:grid;place-items:center;font-family:'Plus Jakarta Sans';font-weight:800;color:#fff;font-size:19px}
  .brand b{font-family:'Plus Jakarta Sans';font-weight:800;font-size:20px}
  .nav-links{display:flex;align-items:center;gap:26px}
  .nav-links a{font-size:14px;font-weight:500;color:var(--muted)}
  .nav-links a:hover{color:var(--ink)}
  @media(max-width:720px){.nav-links a:not(.navcta){display:none}}

  /* ============ HERO ============ */
  .hero{max-width:1140px;margin:0 auto;padding:64px 22px 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
  @media(max-width:880px){.hero{grid-template-columns:1fr;padding-top:42px;gap:36px}}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--mint);color:var(--teal-dk);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:30px;margin-bottom:22px}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:#25D366;box-shadow:0 0 0 3px rgba(37,211,102,.25)}
  .hero h1{font-size:clamp(34px,5vw,52px);font-weight:800}
  .hero h1 .hl{color:var(--teal);position:relative;white-space:nowrap}
  .hero h1 .hl::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:10px;background:rgba(245,158,11,.32);z-index:-1;border-radius:3px}
  .hero p.sub{font-size:18px;color:#3f5358;margin:20px 0 28px;max-width:480px}
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap}
  .trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:26px}
  .trust div{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .trust b{color:var(--ink);font-weight:600}
  .check{color:var(--teal);font-weight:800}

  /* hero visual: floating invoice */
  .hero-visual{position:relative;display:flex;justify-content:center}
  .mock{width:100%;max-width:380px;background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);padding:24px;transform:rotate(-1.4deg);position:relative;z-index:2}
  .mock .m-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:13px}
  .m-tag{font-family:'Plus Jakarta Sans';font-weight:800;font-size:10px;letter-spacing:.14em;color:var(--teal);background:var(--soft);padding:4px 9px;border-radius:6px}
  .mock h4{font-family:'Plus Jakarta Sans';font-weight:800;font-size:17px;margin-top:8px}
  .mock .m-sub{font-size:10.5px;color:var(--muted)}
  .mock .m-meta{text-align:right;font-size:10.5px;color:var(--muted)}
  .mock .m-meta b{font-family:'Plus Jakarta Sans';font-size:12px;color:var(--ink)}
  .m-line{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line);color:#41555A}
  .m-line:first-of-type{margin-top:12px}
  .m-tot{display:flex;justify-content:space-between;margin-top:11px;padding-top:11px;border-top:2px solid var(--ink);font-family:'Plus Jakarta Sans';font-weight:800;font-size:17px}
  .m-tot .amt{color:var(--teal-dk)}
  .m-gst{font-size:10px;color:var(--teal-dk);background:var(--mint);display:inline-block;padding:3px 9px;border-radius:20px;margin-top:10px}
  .wa-bubble{position:absolute;bottom:-18px;right:-6px;z-index:3;background:#25D366;color:#053d1c;font-size:12px;font-weight:600;padding:10px 14px;border-radius:14px 14px 4px 14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;transform:rotate(2deg)}
  .wa-bubble .tick{font-size:13px}
  .blob{position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(15,118,110,.14),transparent 70%);top:-30px;left:-20px;z-index:1}

  /* ============ SECTIONS ============ */
  section.band{max-width:1140px;margin:0 auto;padding:56px 22px}
  .sec-head{text-align:center;max-width:640px;margin:0 auto 40px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:12px}
  .sec-head h2{font-size:clamp(26px,3.4vw,36px);font-weight:800}
  .sec-head p{color:#3f5358;font-size:16.5px;margin-top:12px}

  .features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:820px){.features{grid-template-columns:1fr 1fr}}
  @media(max-width:540px){.features{grid-template-columns:1fr}}
  .feat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
  .feat .ic{width:44px;height:44px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-size:21px;margin-bottom:15px}
  .feat h3{font-size:17px;font-weight:700;margin-bottom:7px}
  .feat p{font-size:14px;color:#46595e}

  /* steps */
  .steps-band{background:var(--ink);color:#fff}
  .steps-band .sec-head h2{color:#fff}
  .steps-band .eyebrow{color:var(--amber)}
  .steps-band .sec-head p{color:#A9C2BF}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  @media(max-width:720px){.steps{grid-template-columns:1fr}}
  .step{position:relative;padding:26px 22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:var(--r)}
  .step .n{font-family:'Plus Jakarta Sans';font-weight:800;font-size:14px;color:var(--ink);background:var(--amber);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;margin-bottom:14px}
  .step h3{font-size:17px;margin-bottom:7px}
  .step p{font-size:14px;color:#A9C2BF}

  /* pricing */
  .price-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:760px;margin:0 auto}
  @media(max-width:620px){.price-grid{grid-template-columns:1fr}}
  .plan{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:30px}
  .plan.pro{border-color:var(--teal);box-shadow:var(--shadow-lg);position:relative}
  .plan.pro::before{content:"Free forever";position:absolute;top:-12px;right:24px;background:var(--amber);color:#3a2700;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px}
  .plan h3{font-size:19px}
  .plan .cost{font-family:'Plus Jakarta Sans';font-weight:800;font-size:38px;margin:8px 0 4px}
  .plan .cost small{font-size:15px;color:var(--muted);font-weight:600}
  .plan ul{list-style:none;margin:18px 0 22px}
  .plan li{font-size:14px;color:#46595e;padding:7px 0;display:flex;gap:10px}
  .plan li .check{flex-shrink:0}
  .plan button{width:100%;justify-content:center}

  /* final cta */
  .cta-band{text-align:center;background:linear-gradient(135deg,var(--teal),var(--teal-dk));border-radius:24px;padding:54px 24px;color:#fff;max-width:1096px;margin:20px auto 0}
  .cta-band h2{font-size:clamp(26px,3.4vw,34px);font-weight:800}
  .cta-band p{color:#CDE5E1;margin:12px auto 26px;max-width:460px;font-size:16.5px}

  footer{text-align:center;padding:40px 22px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
  footer .fbrand{font-family:'Plus Jakarta Sans';font-weight:800;color:var(--ink);font-size:16px;margin-bottom:6px}

  /* ============ APP VIEW ============ */
  #app{display:none}
  .app-head{background:var(--ink);color:#fff;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:40;width:100%;left:0;right:0;box-sizing:border-box}
  .app-actions{display:flex;gap:9px;flex-wrap:wrap}
  .back{background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:10px;cursor:pointer}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;max-width:1240px;margin:22px auto;padding:0 22px 60px}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .form{padding:20px}
  .fsect{margin-bottom:22px}
  .fsect:last-child{margin-bottom:0}
  .feyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .feyebrow::before{content:"";width:18px;height:2px;background:var(--amber);border-radius:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  @media(max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
  label{font-size:11.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
  input,select,textarea{width:100%;font-family:'Inter';font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;transition:.15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
  textarea{resize:vertical;min-height:54px}
  .items{width:100%;min-width:760px;border-collapse:collapse}
  .items-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;padding:6px}
  .items thead th{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:0 6px 7px}
  .items td{padding:3px}
  .items input,.items select{padding:8px 9px;font-size:13px}
  .rm{background:#FDECEC;color:#C0392B;border-radius:8px;width:30px;height:34px;padding:0;font-size:16px;font-weight:700;justify-content:center}
  .additem{margin-top:10px;background:var(--soft);color:var(--teal-dk);width:100%;justify-content:center;border:1.5px dashed #BcD3D0}
  .tiny{font-size:11px;color:var(--muted);margin-top:6px}
  .preview-wrap{position:sticky;top:80px}
  .inv-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* professional bordered GST invoice */
  .gi{border:1.5px solid #111;background:#fff;color:#111;font-size:11px;min-width:660px}
  .gi *{box-sizing:border-box}
  .gi-head{display:flex;justify-content:space-between;gap:12px;padding:9px 11px;border-bottom:1.5px solid #111}
  .gi-name{font-family:'Plus Jakarta Sans';font-weight:800;font-size:21px;color:#1F3864;line-height:1.05}
  .gi-tag{display:inline-block;background:#0F766E;color:#fff;font-weight:700;font-size:10.5px;padding:3px 8px;border-radius:3px;margin:5px 0}
  .gi-addr{font-size:10.5px;white-space:pre-line;margin-top:3px;color:#222}
  .gi-head-r{text-align:right;font-size:10.5px;color:#222;min-width:150px}
  .gi-logo{max-height:80px;max-width:180px;width:auto;height:auto;object-fit:contain;display:block;margin-bottom:6px}
  .gi-3{display:grid;grid-template-columns:1fr 1.1fr 1fr;border-bottom:1.5px solid #111;align-items:center}
  .gi-3>div{padding:5px 9px;font-weight:700}
  .gi-3>div:nth-child(1){border-right:1px solid #111}
  .gi-3>div:nth-child(2){border-right:1px solid #111;text-align:center;font-family:'Plus Jakarta Sans';font-size:16px}
  .gi-3>div:nth-child(3){text-align:right;font-size:10px}
  .gi-two{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid #111}
  .gi-two>div:first-child{border-right:1px solid #111}
  .gi-secthead{text-align:center;font-weight:700;border-bottom:1px solid #111;padding:4px;background:#f4f4f2}
  .gi-kv{display:grid;grid-template-columns:auto 1fr;gap:0}
  .gi-kv>div{padding:4px 8px;border-bottom:1px solid #e3e3e0}
  .gi-kv>div:nth-child(odd){font-weight:700;border-right:1px solid #e3e3e0}
  .gi-meta-row{display:flex;border-bottom:1px solid var(--line);padding:4px 0}
  .gi-meta-row>div{width:50%;padding:0 9px}
  .gi-meta-row>div:first-child{font-weight:700}
  .gi-meta-row>div:nth-child(even){text-align:right;border-left:1px solid var(--line)}
  .ph-col{display:none}
  body.tpl-pharmacy .ph-col{display:table-cell}
  .ht-col{display:none}
  body.tpl-hotel .ht-col{display:table-cell}
  body.tpl-hotel .hide-hotel{display:none}
  body.no-gst .gst-only{display:none!important}
  .gi-items{width:100%;border-collapse:collapse}
  .gi-items th,.gi-items td{border:1px solid #111;padding:4px 6px;font-size:10.5px}
  .gi-items th{text-align:center;font-weight:700;background:#f4f4f2}
  .gi-items td.r{text-align:right}
  .gi-items td.c,.gi-items th.c{text-align:center}
  .gi-items tfoot td{font-weight:700;background:#f9f9f7}
  .gi-bottom{display:grid;grid-template-columns:1fr 1fr}
  .gi-bottom>div:first-child{border-right:1px solid #111}
  .gi-words{padding:7px 9px;border-bottom:1px solid #111;min-height:42px}
  .gi-words .lab{font-weight:700;text-align:center;display:block;margin-bottom:3px}
  .gi-bank{padding:7px 9px;font-size:10.5px}
  .gi-bank .lab{font-weight:700;text-align:center;display:block;border-bottom:1px solid #111;padding-bottom:3px;margin-bottom:5px}
  .gi-bank table{width:100%}
  .gi-bank td{padding:1px 0;vertical-align:top}
  .gi-qr{float:right;text-align:center;font-size:9px}
  .gi-qr img{width:96px;height:96px;display:block}
  .gi-tax .row{display:flex;justify-content:space-between;padding:5px 9px;border-bottom:1px solid #e3e3e0}
  .gi-tax .row.big{font-weight:800;font-size:13px;background:#f4f4f2;border-bottom:1.5px solid #111}
  .gi-sign{padding:9px;font-size:10.5px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
  .gi-sign .cert{text-align:center;border-bottom:1px solid #e3e3e0;padding-bottom:4px;margin-bottom:4px}
  .gi-sign .for{text-align:center;font-weight:700}
  .gi-sign .auth{text-align:center;margin-top:auto;border-top:1px solid #111;padding-top:4px;font-weight:700}
  .gi-terms{padding:7px 9px;border-top:1.5px solid #111;font-size:10px;white-space:pre-line}
  .gi-terms .lab{font-weight:700}
  .gi-thanks{text-align:center;padding:6px;font-size:10.5px;border-top:1px solid #111;font-style:italic}
  .invoice{padding:30px 30px 24px;color:var(--ink)}
  .inv-top{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:16px}
  .inv-from b{font-family:'Plus Jakarta Sans';font-weight:800;font-size:20px;display:block}
  .inv-from p,.inv-meta p{font-size:12px;color:#41555A;margin-top:2px;white-space:pre-line}
  .inv-tag{display:inline-block;font-family:'Plus Jakarta Sans';font-weight:800;font-size:13px;letter-spacing:.12em;color:var(--teal);background:var(--soft);padding:5px 11px;border-radius:7px;margin-bottom:8px}
  .inv-meta{text-align:right}
  .inv-meta .big{font-family:'Plus Jakarta Sans';font-weight:800;font-size:15px}
  .billto{margin:16px 0 14px}
  .billto .lab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .billto b{font-size:15px;font-family:'Plus Jakarta Sans';font-weight:700;display:block;margin-top:3px}
  .billto p{font-size:12px;color:#41555A;white-space:pre-line}
  table.lines{width:100%;border-collapse:collapse;margin-top:6px}
  table.lines th{background:var(--ink);color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:9px 8px;text-align:left}
  table.lines th.r,table.lines td.r{text-align:right}
  table.lines td{font-size:12.5px;padding:9px 8px;border-bottom:1px solid var(--line)}
  table.lines tbody tr:nth-child(even){background:#FaFafa}
  .totals{margin-top:14px;margin-left:auto;width:min(290px,100%)}
  .totals .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:#41555A}
  .totals .row.grand{margin-top:6px;border-top:2px solid var(--ink);padding-top:10px;font-family:'Plus Jakarta Sans';font-weight:800;font-size:18px;color:var(--ink)}
  .totals .row.grand .amt{color:var(--teal-dk)}
  .words{margin-top:14px;font-size:11.5px;color:#41555A;background:var(--soft);border-radius:9px;padding:9px 12px}
  .words b{color:var(--ink)}
  .inv-foot{margin-top:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .pay{font-size:12px;color:#41555A}
  .pay b{color:var(--ink);display:block;margin-bottom:3px;font-family:'Plus Jakarta Sans'}
  .sign{text-align:center;font-size:11.5px;color:var(--muted)}
  .sign .line{width:150px;border-top:1px solid var(--ink);margin:34px auto 5px}
  .thanks{margin-top:16px;text-align:center;font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:11px}
  .supply-pill{font-size:11px;font-weight:600;color:var(--teal-dk);background:var(--soft);border-radius:20px;padding:3px 10px;display:inline-block;margin-top:8px}

  @media print{
    nav,.landing,.app-head,.form,.print-hide{display:none!important}
    body{background:#fff}
    #app{display:block!important}
    .wrap{display:block;margin:0;padding:0;max-width:100%}
    .preview-wrap{position:static}
    .inv-scroll{overflow:visible}
    .gi{min-width:0;width:100%;font-size:9px}
    .gi-name{font-size:18px}
    .gi-qr img{width:80px;height:80px}
    .card{border:none;box-shadow:none}
    .invoice{padding:0}
  }
</style>
</head>
<body>

<!-- ================= LANDING ================= -->
<div class="landing" id="landing">
  <nav>
    <div class="nav-in">
      <div class="brand"><div class="logo">₹</div><b>Invoice Buddy</b></div>
      <div class="nav-links">
        <a href="#features">Features</a>
        <a href="#how">How it works</a>
        <a href="#pricing">Pricing</a>
        <button class="btn-primary navcta" onclick="openApp()">Create invoice</button>
      </div>
    </div>
  </nav>
